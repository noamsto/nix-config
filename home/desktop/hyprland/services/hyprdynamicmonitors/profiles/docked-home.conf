# Docked at home - Samsung monitors with dynamic lid handling
# Template automatically enables/disables laptop screen based on lid state
# Uses .MonitorsByTag for gen5/gen6 compatibility

{{- $left := index .MonitorsByTag "left" -}}
{{- $right := index .MonitorsByTag "right" -}}
{{- $laptop := index .MonitorsByTag "laptop" -}}

# Samsung monitors (always enabled when docked at home)
monitor={{$left.Name}},2560x1440@60,0x0,1.0
monitor={{$right.Name}},2560x1440@60,2560x0,1.0

# Laptop screen (lid-aware) - auto scale for gen5/gen6 compatibility
{{if isLidClosed}}
monitor={{$laptop.Name}},disable
{{else}}
monitor={{$laptop.Name}},preferred,5120x0,auto
{{end}}

# Workspace assignments - left monitor (WS 1-4)
workspace=1,monitor:{{$left.Name}},default:true,name:dev
workspace=2,monitor:{{$left.Name}},name:web
workspace=3,monitor:{{$left.Name}}
workspace=4,monitor:{{$left.Name}}

# Workspace assignments - right monitor (WS 5-8)
workspace=5,monitor:{{$right.Name}},default:true,name:comms
workspace=6,monitor:{{$right.Name}}
workspace=7,monitor:{{$right.Name}}
workspace=8,monitor:{{$right.Name}}

# Workspace 9 - laptop screen (only when lid open)
{{if isLidClosed}}
workspace=9,name:media
{{else}}
workspace=9,monitor:{{$laptop.Name}},name:media
{{end}}
