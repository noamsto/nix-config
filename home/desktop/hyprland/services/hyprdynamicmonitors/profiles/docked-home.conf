# Docked at home - Samsung monitors with dynamic lid handling
# Template automatically enables/disables laptop screen based on lid state

# Samsung monitors (always enabled when docked at home)
monitor=desc:Samsung Electric Company S27H85x H4ZM300138,2560x1440@60,0x0,1.0
monitor=desc:Samsung Electric Company S27H85x H4ZKB00167,2560x1440@60,2560x0,1.0

# Laptop screen (lid-aware)
{{if isLidClosed}}
monitor=eDP-1,disable
{{else}}
monitor=eDP-1,2880x1800@120.00,3680x1440,2.0,transform,0
{{end}}

# Workspace assignments - left monitor (WS 1-4)
workspace=1,monitor:desc:Samsung Electric Company S27H85x H4ZM300138,default:true,name:dev
workspace=2,monitor:desc:Samsung Electric Company S27H85x H4ZM300138,name:web
workspace=3,monitor:desc:Samsung Electric Company S27H85x H4ZM300138
workspace=4,monitor:desc:Samsung Electric Company S27H85x H4ZM300138

# Workspace assignments - right monitor (WS 5-8)
workspace=5,monitor:desc:Samsung Electric Company S27H85x H4ZKB00167,default:true,name:comms
workspace=6,monitor:desc:Samsung Electric Company S27H85x H4ZKB00167
workspace=7,monitor:desc:Samsung Electric Company S27H85x H4ZKB00167
workspace=8,monitor:desc:Samsung Electric Company S27H85x H4ZKB00167

# Workspace 9 - laptop screen (only when lid open)
{{if isLidClosed}}
workspace=9,name:media
{{else}}
workspace=9,monitor:eDP-1,name:media
{{end}}
