# Undocked - laptop screen only with lid-aware suspend behavior
# Template uses {{if isLidClosed}} to handle lid state dynamically
# post_apply_exec script will trigger suspend when lid closed and undocked

{{if isLidClosed}}
monitor=eDP-1,disable
{{else}}
monitor=eDP-1,2880x1800@120,0x0,2.0
{{end}}

