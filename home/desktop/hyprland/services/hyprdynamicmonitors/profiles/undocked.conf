# Undocked - laptop only with dynamic lid handling
# Template handles both lid open (normal use) and lid closed (triggers suspend via script)

{{if isLidClosed}}
# Lid closed while undocked - laptop screen stays on briefly for suspend script
monitor=eDP-1,2880x1800@120,0x0,2.0
{{else}}
# Lid open - normal laptop usage
monitor=eDP-1,2880x1800@120,0x0,2.0
{{end}}

# Named workspaces on laptop
workspace=1,monitor:eDP-1,default:true,name:dev
workspace=2,monitor:eDP-1,name:web
workspace=3,monitor:eDP-1
workspace=4,monitor:eDP-1
workspace=5,monitor:eDP-1,name:comms
workspace=6,monitor:eDP-1
workspace=7,monitor:eDP-1
workspace=8,monitor:eDP-1
workspace=9,monitor:eDP-1,name:media
