# Docked at office - Dell monitors with dynamic lid handling
# Template automatically enables/disables laptop screen based on lid state

# Dell monitors (always enabled when docked at office)
monitor=desc:Dell Inc. DELL P2723DE CC7FH14,2560x1440@60,0x0,1.0
monitor=desc:Dell Inc. DELL P2723DE 4C7FH14,2560x1440@60,2560x0,1.0

# Laptop screen (lid-aware with different positioning for office setup)
{{if isLidClosed}}
monitor=eDP-1,disable
{{else}}
monitor=desc:Lenovo Group Limited B140UAN02.7,1920x1200@60.00,1600x1440,1.0,transform,0
monitor=eDP-1,2880x1800@120.00,3680x1440,2.0,transform,0
{{end}}

# Workspace assignments - left monitor (WS 1-4)
workspace=1,monitor:desc:Dell Inc. DELL P2723DE CC7FH14,default:true,name:dev
workspace=2,monitor:desc:Dell Inc. DELL P2723DE CC7FH14,name:web
workspace=3,monitor:desc:Dell Inc. DELL P2723DE CC7FH14
workspace=4,monitor:desc:Dell Inc. DELL P2723DE CC7FH14

# Workspace assignments - right monitor (WS 5-8)
workspace=5,monitor:desc:Dell Inc. DELL P2723DE 4C7FH14,default:true,name:comms
workspace=6,monitor:desc:Dell Inc. DELL P2723DE 4C7FH14
workspace=7,monitor:desc:Dell Inc. DELL P2723DE 4C7FH14
workspace=8,monitor:desc:Dell Inc. DELL P2723DE 4C7FH14

# Workspace 9 - laptop screen (only when lid open)
{{if isLidClosed}}
workspace=9,name:media
{{else}}
workspace=9,monitor:eDP-1,name:media
{{end}}
