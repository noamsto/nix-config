# Docked at office - Dell monitors with dynamic lid handling
# Template automatically enables/disables laptop screen based on lid state

# Dell monitors (always enabled when docked at office)
monitor=desc:Dell Inc. DELL P2723DE CC7FH14,2560x1440@60,0x0,1.0
monitor=desc:Dell Inc. DELL P2723DE 4C7FH14,2560x1440@60,2560x0,1.0

# Laptop screen (lid-aware with different positioning for office setup)
{{if isLidClosed}}
monitor=eDP-1,disable
{{else}}
monitor=eDP-1,2880x1800@120,1280x1440,2.0
{{end}}
