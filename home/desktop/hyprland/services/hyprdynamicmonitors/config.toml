[general]
destination = "$HOME/.config/hypr/monitors.conf"

# Power events configuration - use line_power_AC (not ACAD) for ThinkPad
[power_events]
[power_events.dbus_query_object]
path = "/org/freedesktop/UPower/devices/line_power_AC"

[[power_events.dbus_signal_match_rules]]
object_path = "/org/freedesktop/UPower/devices/line_power_AC"

# Profile Configuration - Condition-Based Approach
# Using lid_state conditions instead of template functions
# This follows the proven pattern from HDM lid-states example
#
# Profile order: home-docked-lid-open → home-docked-lid-close → work-docked-lid-open → work-docked-lid-close → undocked → undocked-lid-closed

# Home docked with lid OPEN - Samsung monitors + laptop screen
[profiles.home_docked_lid_open]
config_file = "profiles/home-docked-lid-open.conf"
post_apply_exec = "@SCRIPTS_PATH@/home-docked-lid-open.sh"

[[profiles.home_docked_lid_open.conditions.required_monitors]]
description = "Samsung Electric Company S27H85x H4ZM300138"
[[profiles.home_docked_lid_open.conditions.required_monitors]]
description = "Samsung Electric Company S27H85x H4ZKB00167"
[profiles.home_docked_lid_open.conditions]
lid_state = "Opened"

# Home docked with lid CLOSED - Samsung monitors only
[profiles.home_docked_lid_close]
config_file = "profiles/home-docked-lid-close.conf"
post_apply_exec = "@SCRIPTS_PATH@/home-docked-lid-close.sh"

[[profiles.home_docked_lid_close.conditions.required_monitors]]
description = "Samsung Electric Company S27H85x H4ZM300138"
[[profiles.home_docked_lid_close.conditions.required_monitors]]
description = "Samsung Electric Company S27H85x H4ZKB00167"
[profiles.home_docked_lid_close.conditions]
lid_state = "Closed"

# Work docked with lid OPEN - Dell monitors + laptop screen
[profiles.work_docked_lid_open]
config_file = "profiles/work-docked-lid-open.conf"
post_apply_exec = "@SCRIPTS_PATH@/work-docked-lid-open.sh"

[[profiles.work_docked_lid_open.conditions.required_monitors]]
description = "Dell Inc. DELL P2723DE CC7FH14"
[[profiles.work_docked_lid_open.conditions.required_monitors]]
description = "Dell Inc. DELL P2723DE 4C7FH14"
[profiles.work_docked_lid_open.conditions]
lid_state = "Opened"

# Work docked with lid CLOSED - Dell monitors only
[profiles.work_docked_lid_close]
config_file = "profiles/work-docked-lid-close.conf"
post_apply_exec = "@SCRIPTS_PATH@/work-docked-lid-close.sh"

[[profiles.work_docked_lid_close.conditions.required_monitors]]
description = "Dell Inc. DELL P2723DE CC7FH14"
[[profiles.work_docked_lid_close.conditions.required_monitors]]
description = "Dell Inc. DELL P2723DE 4C7FH14"
[profiles.work_docked_lid_close.conditions]
lid_state = "Closed"

# Undocked with lid OPEN - laptop screen active
[profiles.undocked]
config_file = "profiles/undocked.conf"
post_apply_exec = "@SCRIPTS_PATH@/undocked.sh"

[[profiles.undocked.conditions.required_monitors]]
name = "eDP-1"
[profiles.undocked.conditions]
lid_state = "Opened"

# Undocked with lid CLOSED - triggers suspend
[profiles.undocked_lid_closed]
config_file = "profiles/undocked-lid-closed.conf"
post_apply_exec = "@SCRIPTS_PATH@/undocked-lid-closed.sh"

[[profiles.undocked_lid_closed.conditions.required_monitors]]
name = "eDP-1"
[profiles.undocked_lid_closed.conditions]
lid_state = "Closed"
