[general]
destination = "$HOME/.config/hypr/monitors.conf"

# Power events configuration - use line_power_AC (not ACAD) for ThinkPad
[power_events]
[power_events.dbus_query_object]
path = "/org/freedesktop/UPower/devices/line_power_AC"

[[power_events.dbus_signal_match_rules]]
object_path = "/org/freedesktop/UPower/devices/line_power_AC"

# Profile Configuration - Location-based with Lid State Profiles
# HDM auto-detects location via required_monitors and lid state
# Profile order: undocked_lid_closed → undocked → docked-home → docked-office
#
# IMPORTANT: Profile order matters for tie-breaking!
# When multiple profiles match with same score, HDM picks the one defined LAST.
# Docked profiles must come AFTER undocked to win ties when external monitors present.
#
# Architecture:
# - Undocked profiles: Separate profiles for lid open/closed (triggers suspend when closed)
# - Docked profiles: Templates handle lid state (enable/disable laptop screen)
# - workspace-manager.sh receives monitor descriptions as arguments
# - No manual mode switching needed - fully automatic

# Undocked with lid closed - triggers suspend after 2s delay
[profiles.undocked_lid_closed]
config_file = "profiles/undocked-lid-closed.conf"
config_file_type = "template"
pre_apply_exec = "fprintd-control"
post_apply_exec = "workspace-manager undocked-lid-closed"

[profiles.undocked_lid_closed.conditions]
lid_state = "Closed"
required_monitors = [{ name = "eDP-1" }]

# Undocked with lid open - normal laptop usage
[profiles.undocked]
config_file = "profiles/undocked.conf"
config_file_type = "template"
pre_apply_exec = "fprintd-control"
post_apply_exec = "workspace-manager undocked"

[profiles.undocked.conditions]
lid_state = "Opened"
required_monitors = [{ name = "eDP-1" }]

# Docked at home - Samsung monitors (template handles lid state)
[profiles.docked_home]
config_file = "profiles/docked-home.conf"
config_file_type = "template"
pre_apply_exec = "fprintd-control"
post_apply_exec = "workspace-manager docked 'desc:Samsung Electric Company S27H85x H4ZM300138' 'desc:Samsung Electric Company S27H85x H4ZKB00167'"

[profiles.docked_home.conditions]
required_monitors = [
  { description = "Samsung Electric Company S27H85x H4ZM300138" },
  { description = "Samsung Electric Company S27H85x H4ZKB00167" },
  { name = "eDP-1" },
]

# Docked at office - Dell monitors (template handles lid state)
[profiles.docked_office]
config_file = "profiles/docked-office.conf"
config_file_type = "template"
pre_apply_exec = "fprintd-control"
post_apply_exec = "workspace-manager docked 'desc:Dell Inc. DELL P2723DE CC7FH14' 'desc:Dell Inc. DELL P2723DE 4C7FH14'"

[profiles.docked_office.conditions]
required_monitors = [
  { description = "Dell Inc. DELL P2723DE CC7FH14" },
  { description = "Dell Inc. DELL P2723DE 4C7FH14" },
  { name = "eDP-1" },
]
