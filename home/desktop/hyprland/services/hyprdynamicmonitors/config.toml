[general]
destination = "$HOME/.config/hypr/monitors.lua"

# Power events configuration - use line_power_AC (not ACAD) for ThinkPad
[power_events]
[power_events.dbus_query_object]
path = "/org/freedesktop/UPower/devices/line_power_AC"

[[power_events.dbus_signal_match_rules]]
object_path = "/org/freedesktop/UPower/devices/line_power_AC"

# Profile Configuration - Lid State Profiles
# HDM picks a profile from required_monitors and lid state
# Profile order: undocked_lid_closed → undocked
#
# This default only carries the undocked profiles. A host that needs docked
# profiles (they match specific external monitors) points
# nix-config.desktop.monitors.configFile at its own file, which replaces this
# one wholesale: copy these sections and add the docked profiles after the
# undocked ones.
#
# IMPORTANT: Profile order matters for tie-breaking!
# When multiple profiles match with same score, HDM picks the one defined LAST.
# Docked profiles must come AFTER undocked to win ties when external monitors present.
#
# Architecture:
# - Undocked profiles: Separate profiles for lid open/closed (triggers suspend when closed)
# - Docked profiles (host-provided): Templates handle lid state (enable/disable laptop screen)
# - workspace-manager.sh receives monitor descriptions as arguments
# - No manual mode switching needed - fully automatic

# Undocked with lid closed - triggers suspend after 2s delay
# NOTE: Uses a distinct template file (not undocked.conf) so HDM detects a
# content change and fires post_apply_exec. With identical templates, HDM
# short-circuits with "Template content unchanged, skipping write" and the
# suspend handler never runs.
[profiles.undocked_lid_closed]
config_file = "profiles/undocked-lid-closed.lua"
config_file_type = "template"
post_apply_exec = "workspace-manager undocked-lid-closed"

[profiles.undocked_lid_closed.conditions]
lid_state = "Closed"
[[profiles.undocked_lid_closed.conditions.required_monitors]]
name = "eDP-1"
monitor_tag = "laptop"

# Undocked with lid open - normal laptop usage
[profiles.undocked]
config_file = "profiles/undocked.lua"
config_file_type = "template"
post_apply_exec = "workspace-manager undocked"

[profiles.undocked.conditions]
lid_state = "Opened"
[[profiles.undocked.conditions.required_monitors]]
name = "eDP-1"
monitor_tag = "laptop"
