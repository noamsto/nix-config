# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

# Recyclarr Configuration for NasPi Media Server
# Syncs TRaSH Guides quality profiles and custom formats to Radarr and Sonarr

radarr:
  movies-4k:
    base_url: http://localhost:7878
    api_key: !env_var RADARR_API_KEY

    # Quality Definition - TRaSH Guides recommended file sizes
    quality_definition:
      type: movie

    # Quality Profiles
    quality_profiles:
      - name: 4K Remux + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Remux-2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Remux-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-2160p

    # Custom Formats for 4K with Dolby Atmos prioritization
    custom_formats:
      # Audio - Prioritize Dolby Atmos
      - trash_ids:
          # Dolby Atmos
          - 417804f7f2c4308c1f4c5d380d4c4475
        quality_profiles:
          - name: 4K Remux + WEB
            score: 8000

      - trash_ids:
          # TrueHD Atmos
          - 1af239278386be2919e1bcee0bde047e
        quality_profiles:
          - name: 4K Remux + WEB
            score: 7500

      - trash_ids:
          # DTS X
          - 3cafb66171b47f226146a0770576870f
        quality_profiles:
          - name: 4K Remux + WEB
            score: 7000

      - trash_ids:
          # TrueHD
          - 496f355514737f7d83bf7aa4d24f8169
          # DTS-HD MA
          - 2f22d89048b01681dde8afe203bf2e95
        quality_profiles:
          - name: 4K Remux + WEB
            score: 6000

      # HDR Formats
      - trash_ids:
          # Dolby Vision
          - e23edd2482476e595fb990b12e7c609c
          # HDR10+
          - b974a6cd08c1066250f1f177d7aa1225
          # HDR
          - dfb86d5941bc9075d6af23b09c2aeecd
        quality_profiles:
          - name: 4K Remux + WEB
            score: 5000

      # Unwanted
      - trash_ids:
          # BR-DISK
          - ed38b889b31be83fda192888e2286d83
          # LQ
          - 90a6f9a284dff5103f6346090e6280c8
          # 3D
          - b8cd450cbfa689c0259a01d9e29ba3d6
        quality_profiles:
          - name: 4K Remux + WEB
            score: -10000

sonarr:
  tv-4k:
    base_url: http://localhost:8989
    api_key: !env_var SONARR_API_KEY

    # Quality Definition
    quality_definition:
      type: series

    # Quality Profiles
    quality_profiles:
      - name: 4K WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-2160p

    # Custom Formats for TV shows with Dolby Atmos
    custom_formats:
      # Audio - Dolby Atmos prioritization
      - trash_ids:
          # Atmos
          - 417804f7f2c4308c1f4c5d380d4c4475
        quality_profiles:
          - name: 4K WEB
            score: 8000

      - trash_ids:
          # DD+ Atmos
          - 1af239278386be2919e1bcee0bde047e
        quality_profiles:
          - name: 4K WEB
            score: 7500

      - trash_ids:
          # TrueHD
          - 496f355514737f7d83bf7aa4d24f8169
          # DTS-HD MA
          - 2f22d89048b01681dde8afe203bf2e95
        quality_profiles:
          - name: 4K WEB
            score: 6000

      # HDR Formats
      - trash_ids:
          # Dolby Vision
          - e23edd2482476e595fb990b12e7c609c
          # HDR10+
          - b974a6cd08c1066250f1f177d7aa1225
          # HDR
          - dfb86d5941bc9075d6af23b09c2aeecd
        quality_profiles:
          - name: 4K WEB
            score: 5000

      # Unwanted
      - trash_ids:
          # BR-DISK
          - ed38b889b31be83fda192888e2286d83
          # LQ
          - 90a6f9a284dff5103f6346090e6280c8
        quality_profiles:
          - name: 4K WEB
            score: -10000
