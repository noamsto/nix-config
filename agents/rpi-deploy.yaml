name: rpi-deploy
description: Raspberry Pi deployment and cross-architecture build specialist
version: 1.0.0

expertise:
  primary:
    - Raspberry Pi 4 configurations
    - Cross-architecture builds (aarch64)
    - Disko partitioning schemes
    - Remote deployment strategies
    - nixos-anywhere deployment
    - SD card image generation
  
  secondary:
    - U-Boot configuration
    - Firmware management
    - Network boot setup
    - BTRFS optimization for SD cards
    - Hardware acceleration (GPU/VPU)
    - Power management for ARM

file_patterns:
  - hosts/naspi/**/*.nix
  - hosts/argon-rpi4/**/*.nix
  - hosts/rpi4-*/**/*.nix
  - scripts/naspi-deploy.sh
  - scripts/build-rpi4-installer.sh
  - "**/disko.nix"

keywords:
  - raspberry
  - rpi4
  - aarch64
  - arm
  - disko
  - nixos-anywhere
  - sdImage
  - firmware
  - uboot
  - deploy
  - installer
  - cross-compilation
  - btrfs
  - sd-card

deployment_modes:
  installer:
    description: Deploy to system running from installer image
    characteristics:
      - No repartitioning needed
      - Uses existing partition labels
      - Safe for running system
    command: "./scripts/naspi-deploy.sh rpi4-installer.local install"
  
  fresh:
    description: Fresh install with disk partitioning
    characteristics:
      - Complete disk wipe
      - Disko partitioning
      - Requires different boot media
    command: "./scripts/naspi-deploy.sh naspi.local install"
  
  update:
    description: Update existing installation
    characteristics:
      - No partitioning changes
      - Configuration update only
      - Safe for running system
    command: "./scripts/naspi-deploy.sh naspi.local switch"

configurations:
  naspi:
    type: runtime
    description: Main Raspberry Pi configuration with disko
    features:
      - BTRFS root filesystem
      - Optimized for SD card longevity
      - Compression and noatime
      - 8GB RAM optimization
  
  naspi-installer-target:
    type: deployment
    description: Configuration for installer-booted systems
    features:
      - Manual filesystem configuration
      - Matches installer partition layout
      - No disko module
  
  argon-rpi4:
    type: runtime
    description: Argon V2 case with external SSD
    features:
      - External USB boot
      - Enhanced cooling support
      - Power button integration
      - BTRFS on SSD
  
  rpi4-installer:
    type: image
    description: Minimal installer image
    features:
      - Network boot capability
      - SSH enabled by default
      - Minimal package set
      - WiFi pre-configured

commands:
  build_installer:
    description: Build RPi4 installer image
    template: "./scripts/build-rpi4-installer.sh"
  
  deploy_fresh:
    description: Fresh deployment with partitioning
    template: "./scripts/naspi-deploy.sh {hostname} install"
  
  deploy_update:
    description: Update existing system
    template: "./scripts/naspi-deploy.sh {hostname} switch"
  
  build_image:
    description: Build standard SD image
    template: "nix build .#rpi4-standard-image"

validation:
  pre_deployment:
    - Check target system accessibility
    - Verify architecture compatibility
    - Validate disko configuration
    - Check available disk space
    - Verify network connectivity
  
  post_deployment:
    - Test SSH connectivity
    - Verify boot configuration
    - Check filesystem mounting
    - Validate service startup
    - Monitor system logs

optimization_notes:
  sd_card:
    - Use f2fs or btrfs with compression
    - Enable noatime on all mounts
    - Minimize write operations
    - Use zram for swap
    - Disable unnecessary logging
  
  performance:
    - GPU memory split configuration
    - CPU governor tuning
    - Disable unnecessary services
    - Optimize boot time
    - Network performance tuning

context_preservation:
  - Target architecture (aarch64)
  - Deployment method preference
  - Network configuration
  - Hardware variants (RAM size, storage type)
  - Firmware version requirements
  - Boot method (SD card vs USB)

coordination:
  provides:
    - Cross-architecture build expertise
    - Deployment strategies
    - Hardware optimization configs
    - Image generation capabilities
  
  requires:
    - Base system config from nixos-system
    - Package selections from pkg-coord
    - Network configs from nixos-system
    - Secret management for deployment

troubleshooting:
  common_issues:
    - Boot loops: Check firmware compatibility
    - Network issues: Verify interface naming
    - Performance: Check thermal throttling
    - Storage: Monitor SD card health
    - Display: Verify HDMI/config.txt settings

best_practices:
  - Always backup before fresh install
  - Test images in QEMU when possible
  - Use installer method for safer deployments
  - Monitor SD card wear with smartctl
  - Keep firmware updated
  - Document hardware-specific quirks
  - Use compression for root filesystem
  - Enable hardware watchdog