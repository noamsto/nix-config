name: agent-coordination
description: Inter-agent communication and task delegation framework
version: 1.0.0

coordination_rules:
  primary_delegation:
    description: Initial agent selection based on task domain
    rules:
      - pattern: "system|boot|kernel|service"
        agent: nixos-system
      - pattern: "hyprland|waybar|window|desktop"
        agent: hyprland-desktop
      - pattern: "neovim|terminal|shell|git"
        agent: dev-env
      - pattern: "raspberry|rpi|arm|deploy"
        agent: rpi-deploy
      - pattern: "package|dependency|overlay"
        agent: pkg-coord
      - pattern: "flake|input|update|cachix"
        agent: flake-mgr

  collaborative_workflows:
    system_update:
      description: Full system update workflow
      sequence:
        - agent: flake-mgr
          action: Update inputs and validate
        - agent: pkg-coord
          action: Resolve package changes
        - agent: nixos-system
          action: Rebuild system configuration
        - agent: dev-env
          action: Update development tools
        - agent: hyprland-desktop
          action: Reload desktop environment
    
    new_package_installation:
      description: Adding new packages to configuration
      sequence:
        - agent: pkg-coord
          action: Determine package location (system/user)
        - agent: pkg-coord
          action: Check profile compatibility
        - agent: flake-mgr
          action: Verify input requirements
        - agent: relevant_config_agent
          action: Update configuration
        - agent: nixos-system
          action: Rebuild if system package
    
    desktop_customization:
      description: Desktop environment modifications
      sequence:
        - agent: hyprland-desktop
          action: Update desktop configuration
        - agent: pkg-coord
          action: Install required packages
        - agent: dev-env
          action: Update terminal integration
    
    rpi_deployment:
      description: Raspberry Pi system deployment
      sequence:
        - agent: rpi-deploy
          action: Prepare deployment strategy
        - agent: nixos-system
          action: Verify system configuration
        - agent: pkg-coord
          action: Check architecture compatibility
        - agent: flake-mgr
          action: Ensure inputs available
        - agent: rpi-deploy
          action: Execute deployment

  information_sharing:
    system_state:
      provider: nixos-system
      consumers: [all]
      data:
        - Kernel version
        - Active services
        - System architecture
        - Hardware capabilities
    
    package_availability:
      provider: pkg-coord
      consumers: [all]
      data:
        - Installed packages
        - Available overlays
        - Profile restrictions
        - Version constraints
    
    desktop_environment:
      provider: hyprland-desktop
      consumers: [dev-env, pkg-coord]
      data:
        - Active desktop mode
        - Theme settings
        - Display configuration
        - Input settings
    
    development_tools:
      provider: dev-env
      consumers: [hyprland-desktop, pkg-coord]
      data:
        - Active shell
        - Editor configuration
        - Language servers
        - Terminal setup
    
    flake_state:
      provider: flake-mgr
      consumers: [all]
      data:
        - Input versions
        - Available outputs
        - Cache configuration
        - Build settings

  conflict_resolution:
    package_conflicts:
      arbiter: pkg-coord
      resolution: Profile-based selection, version pinning
    
    configuration_conflicts:
      arbiter: flake-mgr
      resolution: Host-specific overrides, modular imports
    
    resource_conflicts:
      arbiter: nixos-system
      resolution: Priority-based allocation, scheduling

  parallel_execution:
    safe_parallel:
      - description: Tasks that can run simultaneously
      - examples:
          - Package searches across different agents
          - Configuration validation
          - Documentation generation
          - Non-overlapping file edits
    
    sequential_required:
      - description: Tasks requiring sequential execution
      - examples:
          - System rebuilds
          - Flake updates
          - Deployment operations
          - Cross-agent dependencies

task_patterns:
  analysis:
    description: Understanding current state
    agents: [all]
    parallel: true
    aggregation: Combine findings
  
  modification:
    description: Changing configuration
    agents: [specific]
    parallel: false
    validation: Required
  
  deployment:
    description: Applying changes
    agents: [nixos-system, rpi-deploy]
    parallel: false
    rollback: Supported
  
  maintenance:
    description: Regular upkeep
    agents: [flake-mgr, pkg-coord]
    parallel: true
    schedule: Weekly

communication_protocol:
  request_format:
    from: requesting_agent
    to: target_agent
    action: requested_action
    data: relevant_context
    priority: high|medium|low
  
  response_format:
    from: responding_agent
    status: success|failure|partial
    data: results
    recommendations: next_steps
  
  broadcast_format:
    from: broadcasting_agent
    event: state_change|update|alert
    data: changed_information
    affects: [affected_agents]

error_handling:
  agent_failure:
    detection: Timeout or error response
    recovery:
      - Retry with backoff
      - Fallback to manual
      - Alert user
      - Document failure
  
  coordination_failure:
    detection: Conflicting states or deadlock
    recovery:
      - Reset to known state
      - Sequential execution
      - User intervention
      - Rollback changes

performance_optimization:
  caching:
    - Agent state caching
    - Result memoization
    - Configuration snapshots
    - Build artifact reuse
  
  load_balancing:
    - Distribute analysis tasks
    - Prioritize critical paths
    - Batch similar operations
    - Resource pooling

monitoring:
  metrics:
    - Task completion time
    - Agent utilization
    - Error rates
    - Cache hit rates
  
  logging:
    - Agent interactions
    - Task delegation
    - Conflict resolution
    - Performance data