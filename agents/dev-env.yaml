name: dev-env
description: Development environment and tooling specialist
version: 1.0.0

expertise:
  primary:
    - Neovim/LazyVim configuration
    - Terminal multiplexer (tmux) setup
    - Shell environments (fish, zsh)
    - Git workflows and tools
    - LSP and language servers
    - Development packages and tools
  
  secondary:
    - Terminal emulators (foot, alacritty)
    - Process management (process-compose)
    - Code formatting and linting
    - Debugging tools
    - Database clients
    - Container development

file_patterns:
  - home/nvim/**/*.nix
  - home/nvim/**/*.lua
  - home/terminal/**/*.nix
  - home/terminal/**/*.fish
  - home/git/**/*.nix
  - home/ssh/**/*.nix
  - home/direnv/**
  - home/kubernetes/**

keywords:
  - neovim
  - lazyvim
  - tmux
  - fish
  - zsh
  - git
  - lazygit
  - terminal
  - lsp
  - mason
  - treesitter
  - telescope
  - development
  - debugging
  - compiler

commands:
  update_plugins:
    description: Update Neovim plugins
    template: "nvim --headless '+Lazy! sync' +qa"
  
  check_lsp:
    description: Check LSP server status
    template: "nvim --headless '+checkhealth lsp' +qa"
  
  tmux_reload:
    description: Reload tmux configuration
    template: "tmux source-file ~/.config/tmux/tmux.conf"
  
  shell_benchmark:
    description: Benchmark shell startup time
    template: "hyperfine --warmup 3 'fish -c exit' 'zsh -c exit'"

validation:
  pre_change:
    - Validate Lua syntax for Neovim configs
    - Check shell script syntax
    - Verify git configuration validity
    - Test tmux configuration
    - Check LSP server availability
  
  post_change:
    - Test Neovim startup
    - Verify plugin installation
    - Check shell completions
    - Test git aliases
    - Validate terminal color schemes

context_preservation:
  - Active shell (fish vs zsh)
  - Installed LSP servers
  - Neovim plugin list
  - Terminal color scheme
  - Git configuration
  - SSH configurations
  - Development languages in use
  - Custom shell functions

coordination:
  provides:
    - Editor configuration
    - Shell environment setup
    - Git workflow tools
    - Development tool availability
  
  requires:
    - Language packages from pkg-coord
    - Compiler toolchains from nixos-system
    - Terminal emulator from desktop agent
    - Font packages from pkg-coord

recent_activity:
  migrations:
    - Shell migration from zsh to fish
    - LazyVim configuration updates
    - Plugin dependency updates
  
  focus_areas:
    - Neovim AI integrations (Avante, CodeCompanion)
    - Terminal tool improvements (television, process-compose)
    - Fish shell optimization
    - Git workflow enhancements

plugin_ecosystem:
  neovim:
    - LazyVim base configuration
    - Avante AI assistant
    - CodeCompanion
    - Mason LSP manager
    - Telescope fuzzy finder
    - Treesitter syntax
    - Catppuccin theme
  
  terminal:
    - Tmux plugin manager
    - Fish plugins (fzf, z, etc.)
    - Starship prompt
    - Television file browser

best_practices:
  - Keep Neovim config modular (per-plugin files)
  - Test LSP configurations per-language
  - Maintain shell compatibility scripts
  - Document custom keybindings
  - Version-lock critical plugins
  - Profile shell startup time
  - Keep git config portable
  - Test terminal compatibility