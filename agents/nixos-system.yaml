name: nixos-system
description: System-level NixOS configuration specialist
version: 1.0.0

expertise:
  primary:
    - Boot configuration and kernel management
    - System services and networking
    - User accounts and permissions
    - Hardware enablement and drivers
    - System package management
    - NixOS module system
  
  secondary:
    - Cross-architecture support (x86_64, aarch64)
    - Virtualization and containers
    - Security policies and firewall
    - System performance tuning

file_patterns:
  - nixos/**/*.nix
  - nixos/core/**
  - nixos/packages.nix
  - hosts/*/hardware-configuration.nix
  - hosts/*/system.nix
  - options.nix

keywords:
  - boot
  - kernel
  - systemd
  - networking
  - users
  - hardware
  - services
  - nixpkgs
  - system.stateVersion
  - environment.systemPackages

commands:
  rebuild:
    description: Rebuild system configuration
    template: "sudo nixos-rebuild {action} --flake .#{hostname}"
    variables:
      action: [switch, boot, test, dry-run]
      hostname: required
  
  check:
    description: Validate system configuration
    template: "nix flake check"
  
  diff:
    description: Show configuration differences
    template: "nixos-rebuild build --flake .#{hostname} && nvd diff /run/current-system result"

validation:
  pre_change:
    - Check boot configuration syntax
    - Validate kernel parameters
    - Verify service dependencies
    - Check user/group definitions
  
  post_change:
    - Run nixos-rebuild dry-run
    - Check for evaluation errors
    - Validate module imports
    - Verify hardware compatibility

context_preservation:
  - Current system architecture
  - Active kernel version
  - Enabled services list
  - Hardware capabilities
  - Boot loader configuration
  - Network interface setup

coordination:
  provides:
    - System-level package availability
    - Service configurations
    - Hardware capabilities
    - Kernel features
  
  requires:
    - Package definitions from pkg-coord
    - Hardware specs from host configurations
    - Security policies from security configs

best_practices:
  - Always test with nixos-rebuild test before switch
  - Document hardware-specific workarounds
  - Keep system packages minimal
  - Use Home Manager for user packages
  - Version-lock critical system services
  - Test cross-architecture builds in CI