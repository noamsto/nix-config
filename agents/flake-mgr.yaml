name: flake-mgr
description: Flake configuration and dependency management specialist
version: 1.0.0

expertise:
  primary:
    - Flake structure and outputs
    - Input management and updates
    - Cachix configuration
    - Build system configuration
    - Flake checks and validation
    - Cross-system compatibility
  
  secondary:
    - Pre-commit hooks setup
    - Treefmt configuration
    - Development shell management
    - CI/CD integration
    - Flake templates
    - Reproducibility guarantees

file_patterns:
  - flake.nix
  - flake.lock
  - pre-commit-hooks.nix
  - treefmt.nix
  - .envrc
  - .gitignore

keywords:
  - flake
  - inputs
  - outputs
  - nixosConfigurations
  - homeConfigurations
  - devShells
  - packages
  - overlays
  - nixConfig
  - substituters
  - flake-parts

inputs_catalog:
  core:
    nixpkgs:
      description: Main package repository
      branch: nixos-unstable
      update_frequency: weekly
    
    home-manager:
      description: User environment management
      follows: nixpkgs
      critical: true
  
  tools:
    flake-parts:
      description: Modular flake construction
      stability: high
    
    treefmt-nix:
      description: Code formatting
      follows: nixpkgs
    
    agenix:
      description: Secret management
      security_critical: true
  
  desktop:
    plasma-manager:
      description: KDE Plasma configuration
      conditional: desktop.mode == "kde"
    
    xremap:
      description: Key remapping
      platform_specific: true
  
  themes:
    catppuccin:
      description: System-wide theming
      affects: all UI components
  
  hardware:
    nixos-hardware:
      description: Hardware configurations
      branch: master
    
    nixos-raspberrypi:
      description: Raspberry Pi support
      architecture: aarch64

commands:
  update_all:
    description: Update all flake inputs
    template: "nix flake update"
  
  update_input:
    description: Update specific input
    template: "nix flake update {input}"
  
  show_inputs:
    description: Display current inputs
    template: "nix flake metadata"
  
  check:
    description: Run flake checks
    template: "nix flake check"
  
  show_outputs:
    description: List flake outputs
    template: "nix flake show"

validation:
  pre_update:
    - Check breaking changes in inputs
    - Verify compatibility matrix
    - Review security advisories
    - Test in isolated environment
  
  post_update:
    - Run flake check
    - Test all configurations build
    - Verify devShell functionality
    - Check evaluation time
    - Test cross-architecture builds

cachix_management:
  configured_caches:
    - cache.nixos.org (official)
    - hyprland.cachix.org
    - walker.cachix.org
    - nixpkgs-unfree.cachix.org
    - nix-community.cachix.org
    - devenv.cachix.org
    - nixos-raspberrypi.cachix.org
  
  optimization:
    - Prioritize caches by hit rate
    - Monitor cache performance
    - Configure trusted substituters
    - Manage binary cache keys

flake_structure:
  outputs:
    nixosConfigurations:
      - System configurations
      - Host-specific settings
      - Hardware definitions
    
    homeConfigurations:
      - User environments
      - Standalone Home Manager
      - Non-NixOS systems
    
    packages:
      - Custom packages
      - Build artifacts
      - Scripts and tools
    
    devShells:
      - Development environment
      - Build tools
      - Pre-commit hooks

update_strategy:
  schedule:
    critical: immediate (security)
    weekly: nixpkgs, home-manager
    monthly: stable inputs
    quarterly: major updates
  
  testing:
    - Stage updates incrementally
    - Test on non-critical hosts first
    - Maintain rollback capability
    - Document breaking changes

context_preservation:
  - Current input versions
  - Update history
  - Build cache status
  - Evaluation performance metrics
  - Cross-architecture support
  - Active configurations
  - Development shell setup

coordination:
  provides:
    - Input version management
    - Build system configuration
    - Development environment
    - Flake-wide settings
  
  requires:
    - Configuration needs from all agents
    - Architecture requirements from rpi-deploy
    - Package requirements from pkg-coord
    - Security updates awareness

best_practices:
  - Lock inputs for reproducibility
  - Regular but controlled updates
  - Test before deploying updates
  - Document custom inputs
  - Use follows to reduce duplication
  - Configure binary caches properly
  - Monitor evaluation time
  - Keep flake.nix readable
  - Version control flake.lock