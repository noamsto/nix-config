name: Build

on:
  workflow_call:
    inputs:
      push-cache:
        type: boolean
        default: false
      tree-artifact:
        type: string
        default: ""
      report:
        type: boolean
        default: false
      report-name:
        type: string
        default: ""
    secrets:
      NIX_CACHE_SIGNING_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  # R2 cache (lib/caches.nix r2): public bucket name and S3 endpoint. The signing
  # key and write credentials reach only the Push to R2 steps.
  # SYNC: same values as .github/workflows/cache-gc.yml.
  R2_BUCKET: nix-config-cache
  R2_ENDPOINT: https://0940b7dd4fd2fb385eefe2ab9ac8daf0.r2.cloudflarestorage.com

jobs:
  # Skipped while the repo is private: Actions billing blocks these jobs there; they run once the repo is public.
  check:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare step logs
        run: mkdir -p "$RUNNER_TEMP/logs"

      # Pristine base checkout for the analyzer, taken before the tree is copied over.
      # Also the trusted lock for tools run while cache credentials are reachable
      # (nix-fast-build here, rclone in nix_cache.py).
      - name: Base worktree
        if: ${{ inputs.tree-artifact != '' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD
          echo "TOOLS_FLAKE=git+file://$RUNNER_TEMP/base?shallow=1" >> "$GITHUB_ENV"

      - name: Download tree
        if: ${{ inputs.tree-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tree-artifact }}
          path: ${{ runner.temp }}/tree

      - name: Apply tree
        if: ${{ inputs.tree-artifact != '' }}
        run: cp "$RUNNER_TEMP/tree/flake.lock" "$RUNNER_TEMP/tree/pins.json" .

      # Before Nix is installed: it grows the Nix volume by repurposing the
      # runner's spare disk. The full build below does not fit in the stock free space.
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # So the flake's nixConfig substituters are used.
          extra-conf: accept-flake-config = true

      - name: Free space
        run: df -h

      # Adds every lib/caches.nix cache — the R2 cache and the third-party
      # substituters — through NIX_CONFIG `extra-substituters`/`extra-trusted-public-keys`,
      # the only route that sticks because nix-fast-build builds by .drv path where the
      # flake's nixConfig does not apply. The step fails unless Nix really queries R2.
      - name: Configure substituters
        continue-on-error: ${{ inputs.report }}
        run: python3 scripts/nix-cache/nix_cache.py substituter

      # nix-fast-build (from the flake's locked nixpkgs, the pre-bump lock on
      # update-bot runs) evaluates in parallel and builds only what no substituter
      # has; any failed attr fails the job.
      - name: Build checks
        id: checks
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/checks.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#checks.x86_64-linux 2>&1 | tee "$RUNNER_TEMP/logs/checks.log"

      - name: Build packages
        id: packages
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/packages.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#packages.x86_64-linux 2>&1 | tee "$RUNNER_TEMP/logs/packages.log"

      - name: Build devShells
        id: devshells
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/devshells.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#devShells.x86_64-linux 2>&1 | tee "$RUNNER_TEMP/logs/devshells.log"

      - name: Build formatter
        id: formatter
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/formatter.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#formatter.x86_64-linux 2>&1 | tee "$RUNNER_TEMP/logs/formatter.log"

      # One job at a time: priors' CPU-bound property tests time out (10m) when they share
      # the runner with parallel builds.
      - name: Build example host
        id: example
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/example.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached --max-jobs 1 ${{ inputs.report && '--option keep-going true' || '' }} -f .#nixosConfigurations.example.config.system.build.toplevel 2>&1 | tee "$RUNNER_TEMP/logs/example.log"

      # The checks were built or confirmed cached above; this keeps flake check's
      # structural validation of modules, overlays and apps without rebuilding.
      - name: Flake check (structure)
        id: flake-check
        shell: bash
        continue-on-error: ${{ inputs.report }}
        run: nix flake check -L --no-build 2>&1 | tee "$RUNNER_TEMP/logs/flake-check.log"

      # Signs and uploads what this job built that no upstream cache serves (plus
      # the Pi kernel outputs in aarch64-linux). Only with push-cache; the signing key
      # and R2 write credentials exist in this step's environment alone.
      - name: Push to R2
        if: ${{ inputs.push-cache && !cancelled() }}
        continue-on-error: ${{ inputs.report }}
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/nix-cache/nix_cache.py push --job check

      - name: Analyze failures
        if: ${{ always() && inputs.report }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/update-bot/update_bot.py analyze --system x86_64-linux --job check --logs "$RUNNER_TEMP/logs" --steps-json "$STEPS" --expected-steps "checks packages devshells formatter example flake-check" --base-dir "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/report/report.json"

      - name: Upload report
        if: ${{ always() && inputs.report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}-check
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7

  # Only what the Mac uses: its packages, no checks, devShells or formatter.
  darwin:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare step logs
        run: mkdir -p "$RUNNER_TEMP/logs"

      # Pristine base checkout for the analyzer, taken before the tree is copied over.
      # Also the trusted lock for tools run while cache credentials are reachable
      # (nix-fast-build here, rclone in nix_cache.py).
      - name: Base worktree
        if: ${{ inputs.tree-artifact != '' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD
          echo "TOOLS_FLAKE=git+file://$RUNNER_TEMP/base?shallow=1" >> "$GITHUB_ENV"

      - name: Download tree
        if: ${{ inputs.tree-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tree-artifact }}
          path: ${{ runner.temp }}/tree

      - name: Apply tree
        if: ${{ inputs.tree-artifact != '' }}
        run: cp "$RUNNER_TEMP/tree/flake.lock" "$RUNNER_TEMP/tree/pins.json" .

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # So the flake's nixConfig substituters are used.
          extra-conf: accept-flake-config = true

      # As in the check job: every lib/caches.nix cache through NIX_CONFIG, and it
      # fails unless Nix really queries R2.
      - name: Configure substituters
        continue-on-error: ${{ inputs.report }}
        run: python3 scripts/nix-cache/nix_cache.py substituter

      # packages.aarch64-darwin is exactly deja-vu, gh-repo-defaults, linear-cli,
      # pi-lens, pi-vim, pi-web-access and rpiv-todo.
      - name: Build packages
        id: darwin-packages
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/darwin-packages.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#packages.aarch64-darwin 2>&1 | tee "$RUNNER_TEMP/logs/darwin-packages.log"

      # As in the check job: signed upload to R2, push-cache only.
      - name: Push to R2
        if: ${{ inputs.push-cache && !cancelled() }}
        continue-on-error: ${{ inputs.report }}
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/nix-cache/nix_cache.py push --job darwin

      - name: Analyze failures
        if: ${{ always() && inputs.report }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/update-bot/update_bot.py analyze --system aarch64-darwin --job darwin --logs "$RUNNER_TEMP/logs" --steps-json "$STEPS" --expected-steps "darwin-packages" --base-dir "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/report/report.json"

      - name: Upload report
        if: ${{ always() && inputs.report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}-darwin
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7

  # Native ARM build of the Raspberry Pi example host, kernel included, pushed to
  # R2 so Pi hosts built on this library substitute it instead of compiling.
  aarch64-linux:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    # A cold kernel build is long; GitHub's hard limit is 6 h.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare step logs
        run: mkdir -p "$RUNNER_TEMP/logs"

      # Pristine base checkout for the analyzer, taken before the tree is copied over.
      # Also the trusted lock for tools run while cache credentials are reachable
      # (nix-fast-build here, rclone in nix_cache.py).
      - name: Base worktree
        if: ${{ inputs.tree-artifact != '' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD
          echo "TOOLS_FLAKE=git+file://$RUNNER_TEMP/base?shallow=1" >> "$GITHUB_ENV"

      - name: Download tree
        if: ${{ inputs.tree-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tree-artifact }}
          path: ${{ runner.temp }}/tree

      - name: Apply tree
        if: ${{ inputs.tree-artifact != '' }}
        run: cp "$RUNNER_TEMP/tree/flake.lock" "$RUNNER_TEMP/tree/pins.json" .

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # So the flake's nixConfig substituters (incl. nixos-raspberrypi) are used.
          extra-conf: accept-flake-config = true

      # Informational only: shows whether a cold kernel build is short of disk.
      # nothing-but-nix is not used: unverified on arm runners.
      - name: Disk space
        run: df -h

      # As in the check job: every lib/caches.nix cache through NIX_CONFIG, and it
      # fails unless Nix really queries R2.
      - name: Configure substituters
        continue-on-error: ${{ inputs.report }}
        run: python3 scripts/nix-cache/nix_cache.py substituter

      - name: Build example Raspberry Pi 4 host
        id: rpi4
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/rpi4.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#nixosConfigurations.example-rpi4.config.system.build.toplevel 2>&1 | tee "$RUNNER_TEMP/logs/rpi4.log"

      - name: Build packages
        id: arm-packages
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/arm-packages.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#packages.aarch64-linux 2>&1 | tee "$RUNNER_TEMP/logs/arm-packages.log"

      # Not checks.aarch64-linux: it includes NixOS VM tests, which need KVM that
      # the arm runner may not offer; the x86_64 job already runs the checks.
      - name: Build devShells
        id: arm-devshells
        shell: bash
        continue-on-error: ${{ inputs.report }}
        env:
          NFB_JSON_DIR: ${{ runner.temp }}/logs/arm-devshells.nix-json
        run: nix run --inputs-from "${TOOLS_FLAKE:-.}" nixpkgs#nix-fast-build -- --no-nom --nix "$GITHUB_WORKSPACE/scripts/update-bot/nix-json-tee" --skip-cached ${{ inputs.report && '--option keep-going true' || '' }} -f .#devShells.aarch64-linux 2>&1 | tee "$RUNNER_TEMP/logs/arm-devshells.log"

      # As in the check job: signed upload to R2, push-cache only; also force-includes
      # the Pi kernel's out, dev and modules outputs. After a failed Pi build they
      # are only substituted, never compiled a second time here.
      - name: Push to R2
        if: ${{ inputs.push-cache && !cancelled() }}
        continue-on-error: ${{ inputs.report }}
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/nix-cache/nix_cache.py push --job aarch64-linux ${{ steps.rpi4.outcome != 'success' && '--no-build-pins' || '' }}

      - name: Analyze failures
        if: ${{ always() && inputs.report }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/update-bot/update_bot.py analyze --system aarch64-linux --job aarch64-linux --logs "$RUNNER_TEMP/logs" --steps-json "$STEPS" --expected-steps "rpi4 arm-packages arm-devshells" --base-dir "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/report/report.json"

      - name: Upload report
        if: ${{ always() && inputs.report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}-aarch64-linux
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 7
