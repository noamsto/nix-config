name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Push runs get a group each: GitHub cancels a pending run whenever a newer one
# queues, and a cancelled push run on main would leave its range unscanned.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pushes only on main. The R2 signing key and credentials are withheld from every
  # other run, so PR code (same-repo branches get secrets) cannot read them and push
  # into the trusted cache; the R2 push step does not run without push-cache.
  build:
    uses: ./.github/workflows/build.yml
    with:
      push-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
      R2_ACCESS_KEY_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY || '' }}

  secrets:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Scan new commits for secrets
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # Only the new range: older history is gated elsewhere.
        # git log -p prints no patch for merges, so a conflict resolution would go unscanned.
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            range="-1 $AFTER"
          else
            if ! git cat-file -e "$BEFORE^{commit}"; then
              git fetch --no-tags origin "$BEFORE" || true
            fi
            if ! git cat-file -e "$BEFORE^{commit}"; then
              echo "cannot resolve push range $BEFORE..$AFTER; scan it manually" >&2
              exit 1
            fi
            range="$BEFORE..$AFTER"
          fi
          nix run --inputs-from . nixpkgs#betterleaks -- git --log-opts="--diff-merges=first-parent $range" --redact --no-banner .
