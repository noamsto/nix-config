name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Push runs get a group each: GitHub cancels a pending run whenever a newer one
# queues, and a cancelled push run on main would leave its range unscanned.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped while the repo is private: Actions billing blocks these jobs there; they run once the repo is public.
  check:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Before Nix is installed: it grows the Nix volume by repurposing the
      # runner's spare disk. The full build below does not fit in the stock free space.
      # The anonymous-fetch step below uses a fresh store on /, which needs more than the default 2 GB.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          root-safe-haven: 10240

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # So the flake's nixConfig substituters are used.
          extra-conf: accept-flake-config = true

      - name: Every input fetches anonymously
        shell: bash
        # Fresh store and fetcher cache so nothing already fetched satisfies a
        # node; access-tokens '' overrides the token the installer writes to nix.conf.
        # Substitution is off too, so a cache can't stand in for a fetch the public can't make.
        run: |
          env -u NIX_CONFIG GIT_SSH_COMMAND=false XDG_CACHE_HOME="$(mktemp -d)" nix flake archive --json --store "$(mktemp -d)" --option access-tokens '' --option substituters '' --option accept-flake-config false > /dev/null

      - name: Free space
        run: df -h

      # Pushes only on main. The token is withheld from every other run, so PR code
      # (same-repo branches get secrets) cannot read it and push into the trusted cache.
      # An empty token makes the action read-only rather than failing.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: noamsto-nix-config
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      # nix-fast-build (from the flake's locked nixpkgs) evaluates in parallel and
      # builds only what no substituter has; any failed attr fails the job.
      - name: Build checks
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached -f .#checks.x86_64-linux

      - name: Build packages
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached -f .#packages.x86_64-linux

      - name: Build devShells
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached -f .#devShells.x86_64-linux

      - name: Build formatter
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached -f .#formatter.x86_64-linux

      - name: Build example host
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --no-nom --skip-cached -f .#nixosConfigurations.example.config.system.build.toplevel

      # The checks were built or confirmed cached above; this keeps flake check's
      # structural validation of modules, overlays and apps without rebuilding.
      - name: Flake check (structure)
        run: nix flake check -L --no-build

  secrets:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Scan new commits for secrets
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # Only the new range: older history is gated elsewhere.
        # git log -p prints no patch for merges, so a conflict resolution would go unscanned.
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            range="-1 $AFTER"
          else
            if ! git cat-file -e "$BEFORE^{commit}"; then
              git fetch --no-tags origin "$BEFORE" || true
            fi
            if ! git cat-file -e "$BEFORE^{commit}"; then
              echo "cannot resolve push range $BEFORE..$AFTER; scan it manually" >&2
              exit 1
            fi
            range="$BEFORE..$AFTER"
          fi
          nix run --inputs-from . nixpkgs#betterleaks -- git --log-opts="--diff-merges=first-parent $range" --redact --no-banner .
