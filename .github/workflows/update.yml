name: Update inputs

on:
  schedule:
    # 02:17 UTC: off the hour, because GitHub delays or drops top-of-hour schedules under load.
    # Still lands well before the private host flake's 05:30 UTC gate picks up main.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      # Set only by the run that finds main moved and starts its replacement; that
      # replacement starts no further run if main moves again.
      rerun:
        description: Fresh run started because main moved during the previous run
        type: boolean
        default: false
      source:
        description: "On-demand narrow run: noamsto/<repo>, a key of .github/upstreams.json (see header)"
        type: string
        default: ""
      rev:
        description: "On-demand narrow run: 40-hex upstream commit for source (see header)"
        type: string
        default: ""
  repository_dispatch:
    types: [upstream-updated]

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Triggers: the 02:17 nightly (schedule); workflow_dispatch, with no inputs (the
# full manual/rerun path) or with source/rev (the on-demand narrow path and its
# rerun); and repository_dispatch upstream-updated from a producer whose input
# this repo tracks.
#
# Narrow mode: prepare locks only the input that the announced source maps to in
# .github/upstreams.json, then the same attempt gate and land path run. A narrow
# block fails the run (error annotation and the step summary) instead of touching
# the update-blocked issue (the nightly retries and reports there).
#
# Trust invariant: schedule and dispatch runs only, on main only (every job gates
# on github.ref and the public repo). Every job checks out this run's own
# github.sha (the default checkout); the only other bytes are flake.lock/
# pins.json artifacts produced by this run's jobs. Never the bot branch or a PR
# head. The dispatch payload and the source/rev inputs are untrusted data: they
# enter only via step env into update_bot.py select, which allowlists source
# against .github/upstreams.json and shape-checks rev as 40 hex; only validated
# values reach outputs, commands, the PR body or redispatch. Nothing from the
# payload is checked out or used as a ref, and rev never pins anything (the
# input always moves to its newest upstream).
#
# Notify: after any run squash-merges on main, one repository_dispatch per
# recipient. Recipients are the entries of .github/consumers.json (public, empty
# by default) plus the repo secret CASCADE_CONSUMERS (a JSON array of
# noamsto/<repo> this public repo must not name); the secret is masked in logs
# and the job names (matrix values) show only an index. A malformed secret fails
# the recipients job after landing. Recipients and notify run only while
# vars.CASCADE_APP_ID is set; notify is skipped when the recipient list is empty.
# The App private key lives only in the notify job, which runs only update_bot.py
# from this run's own github.sha.
#
# Concurrency: one shared `update` group with cancel-in-progress false, so
# on-demand runs never race the nightly and bursts coalesce into the newest
# pending run; a pending nightly can be replaced by a newer on-demand run and
# slips to the next night. A narrow run force-pushes bot/flake-update, so it can
# rewrite a nightly PR left open by a main-moved race; the full content returns
# at the next nightly.
#
# Job conditions: GitHub's implicit success() skips a job whenever any ancestor
# was skipped, so every job after prepare starts with !cancelled() and checks the
# results and outputs it depends on explicitly.
jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      input: ${{ steps.select.outputs.input }}
      source: ${{ steps.select.outputs.source }}
      rev: ${{ steps.select.outputs.rev }}
      combined-changed: ${{ steps.prepare.outputs.combined-changed }}
      nixpkgs-changed: ${{ steps.prepare.outputs.nixpkgs-changed }}
      inputs-changed: ${{ steps.prepare.outputs.inputs-changed }}
      narrow-changed: ${{ steps.prepare.outputs.narrow-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Untrusted dispatch payload: env only (see the trust invariant).
      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.client_payload.source || inputs.source || '' }}
          REV: ${{ github.event.client_payload.rev || inputs.rev || '' }}
        run: python3 scripts/update-bot/update_bot.py select --event="$EVENT" --source="$SOURCE" --rev="$REV"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ steps.select.outputs.mode != 'skip' }}
        with:
          extra-conf: accept-flake-config = true

      - name: Prepare trees
        id: prepare
        if: ${{ steps.select.outputs.mode != 'skip' }}
        env:
          INPUT: ${{ steps.select.outputs.input }}
        run: python3 scripts/update-bot/update_bot.py prepare --out "$RUNNER_TEMP/trees" ${INPUT:+--only "$INPUT"}

      - name: Upload combined tree
        if: ${{ steps.prepare.outputs.combined-changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-combined-0
          path: ${{ runner.temp }}/trees/combined
          if-no-files-found: error
          retention-days: 7

      - name: Upload nixpkgs tree
        if: ${{ steps.prepare.outputs.nixpkgs-changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-nixpkgs-0
          path: ${{ runner.temp }}/trees/nixpkgs
          if-no-files-found: error
          retention-days: 7

      - name: Upload inputs tree
        if: ${{ steps.prepare.outputs.inputs-changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-inputs-0
          path: ${{ runner.temp }}/trees/inputs
          if-no-files-found: error
          retention-days: 7

      - name: Upload narrow tree
        if: ${{ steps.prepare.outputs.narrow-changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-narrow-0
          path: ${{ runner.temp }}/trees/narrow
          if-no-files-found: error
          retention-days: 7

  # An unchanged combined tree ends the run: no build, PR or issue.
  combined:
    needs: prepare
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'full' && needs.prepare.outputs.combined-changed == 'true' }}
    uses: ./.github/workflows/update-attempt.yml
    with:
      attempt: combined
      tree-artifact: tree-combined-0
    # Only build.yml uses the keys (the R2 push). This
    # workflow runs on schedule or dispatch on main and never builds PR code; the
    # ref check keeps them withheld even if that ever changes.
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
      R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY || '' }}

  # Only after the combined tree stayed red, and only when both sides changed (a
  # half equal to the combined tree would repeat it). Each half lands or blocks
  # on its own.
  split-nixpkgs:
    needs: [prepare, combined]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'full' && needs.prepare.outputs.combined-changed == 'true' && needs.combined.outputs.result != 'land' && needs.prepare.outputs.nixpkgs-changed == 'true' && needs.prepare.outputs.inputs-changed == 'true' }}
    uses: ./.github/workflows/update-attempt.yml
    with:
      attempt: nixpkgs
      tree-artifact: tree-nixpkgs-0
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
      R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY || '' }}

  split-inputs:
    needs: [prepare, combined]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'full' && needs.prepare.outputs.combined-changed == 'true' && needs.combined.outputs.result != 'land' && needs.prepare.outputs.nixpkgs-changed == 'true' && needs.prepare.outputs.inputs-changed == 'true' }}
    uses: ./.github/workflows/update-attempt.yml
    with:
      attempt: inputs
      tree-artifact: tree-inputs-0
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
      R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY || '' }}

  # Only the announced input, through the same gate as a full attempt.
  narrow:
    needs: prepare
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'narrow' && needs.prepare.outputs.narrow-changed == 'true' }}
    uses: ./.github/workflows/update-attempt.yml
    with:
      attempt: narrow
      tree-artifact: tree-narrow-0
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
      R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID || '' }}
      R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY || '' }}

  finalize:
    needs: [prepare, combined, split-nixpkgs, split-inputs, narrow]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.prepare.result == 'success' && (needs.prepare.outputs.combined-changed == 'true' || needs.prepare.outputs.narrow-changed == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      land: ${{ steps.finalize.outputs.land }}
      blocked: ${{ steps.finalize.outputs.blocked }}
      land-tree: ${{ steps.finalize.outputs.land-tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A skipped or failed attempt has empty outputs, which finalize reads as not run.
      - name: Finalize
        id: finalize
        env:
          COMBINED: ${{ needs.combined.outputs.result }}
          NIXPKGS: ${{ needs.split-nixpkgs.outputs.result }}
          INPUTS: ${{ needs.split-inputs.outputs.result }}
          COMBINED_TREE: ${{ needs.combined.outputs.tree-artifact }}
          NIXPKGS_TREE: ${{ needs.split-nixpkgs.outputs.tree-artifact }}
          INPUTS_TREE: ${{ needs.split-inputs.outputs.tree-artifact }}
          MODE: ${{ needs.prepare.outputs.mode }}
          NARROW: ${{ needs.narrow.outputs.result }}
          NARROW_TREE: ${{ needs.narrow.outputs.tree-artifact }}
          INPUT: ${{ needs.prepare.outputs.input }}
        run: |
          python3 scripts/update-bot/update_bot.py finalize --combined "$COMBINED" --nixpkgs "$NIXPKGS" --inputs "$INPUTS" --mode "$MODE" --narrow "$NARROW" --input "$INPUT"
          land=$(jq -r .land final.json)
          case "$land" in
            combined) tree="$COMBINED_TREE" ;;
            nixpkgs) tree="$NIXPKGS_TREE" ;;
            inputs) tree="$INPUTS_TREE" ;;
            narrow) tree="$NARROW_TREE" ;;
            *) tree="" ;;
          esac
          echo "land-tree=$tree" >>"$GITHUB_OUTPUT"

      - name: Upload final
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-final
          path: final.json
          if-no-files-found: error
          retention-days: 7

  land:
    needs: [prepare, finalize]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.finalize.result == 'success' && needs.finalize.outputs.land != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      dispatch: ${{ steps.main.outputs.dispatch }}
      landed-sha: ${{ steps.landed.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: accept-flake-config = true

      - name: Download tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.finalize.outputs.land-tree }}
          path: ${{ runner.temp }}/tree

      - name: Apply tree
        run: |
          cp "$RUNNER_TEMP/tree/flake.lock" "$RUNNER_TEMP/tree/pins.json" .
          git show HEAD:flake.lock >"$RUNNER_TEMP/base-lock.json"
          git show HEAD:pins.json >"$RUNNER_TEMP/base-pins.json"

      - name: Advance fallback
        id: fallback
        run: python3 scripts/update-bot/update_bot.py advance-fallback --base-lock "$RUNNER_TEMP/base-lock.json"

      - name: PR body
        env:
          ATTEMPT: ${{ needs.finalize.outputs.land }}
          ADVANCED: ${{ steps.fallback.outputs.advanced }}
          SOURCE: ${{ needs.prepare.outputs.source }}
          REV: ${{ needs.prepare.outputs.rev }}
        run: |
          python3 scripts/update-bot/update_bot.py pr-body --attempt "$ATTEMPT" \
            --base-lock "$RUNNER_TEMP/base-lock.json" --base-pins "$RUNNER_TEMP/base-pins.json" \
            --advanced "$ADVANCED" --out "$RUNNER_TEMP/pr-body.md" \
            --source "$SOURCE" --rev "$REV"

      - name: Commit
        id: commit
        env:
          ATTEMPT: ${{ needs.finalize.outputs.land }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock pins.json
          if git diff --cached --quiet; then
            echo "::notice::nothing to land: the $ATTEMPT tree matches main"
            echo "committed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit message comes from lock-commit (the same message the
          # interactive `lock-commit` writes). Message generation never blocks
          # landing: on any failure the plain subject with an empty body stands.
          subject="chore(flake): update inputs ($ATTEMPT)"
          body=""
          if ! git diff --cached --quiet -- flake.lock; then
            if msg=$(nix run .#lock-commit -- --dry-run 2>"$RUNNER_TEMP/lock-commit.err") && [[ -n "$msg" ]]; then
              subject=$(head -n1 <<<"$msg")
              body=$(tail -n +3 <<<"$msg")
            else
              echo "::warning::lock-commit failed; using the plain commit message"
              cat "$RUNNER_TEMP/lock-commit.err" || true
            fi
          fi
          extra=""
          if ! git diff --cached --quiet -- pins.json; then
            extra="Updates pins.json."
          fi
          if ! git diff --cached --quiet -- flake.nix; then
            extra+="${extra:+ }Advances nixpkgs-fallback."
          fi
          if [[ -n "$extra" ]]; then
            body+="${body:+$'\n\n'}$extra"
          fi
          printf '%s' "$subject" >"$RUNNER_TEMP/commit-subject.txt"
          printf '%s' "$body" >"$RUNNER_TEMP/commit-body.txt"
          # GitHub holds pull_request runs on bot PRs for manual approval; they
          # expire as failures. This run already builds everything it merges, so
          # the PR head carries [skip ci] to suppress those runs; the squash
          # commit on main does not (the merge step passes its own subject).
          git commit -m "$subject [skip ci]" -m "$body"
          echo "committed=true" >>"$GITHUB_OUTPUT"

      # A lock built against an old main can conflict with it or miss newer
      # pins.json entries, so a moved main skips publishing (the blocked job still
      # reports this run's build) and a fresh run builds on the new main.
      - name: Check main
        id: main
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          RERUN: ${{ inputs.rerun || false }}
        run: python3 scripts/update-bot/update_bot.py check-main --run-sha "$GITHUB_SHA" --rerun "$RERUN"

      - name: Push branch
        if: ${{ steps.commit.outputs.committed == 'true' && steps.main.outputs.moved == 'false' }}
        run: git push --force origin HEAD:refs/heads/bot/flake-update

      - name: Open or update PR
        id: pr
        if: ${{ steps.commit.outputs.committed == 'true' && steps.main.outputs.moved == 'false' }}
        run: |
          n=$(gh pr list --head bot/flake-update --state open --json number --jq '.[0].number // empty')
          if [[ -n "$n" ]]; then
            gh pr edit "$n" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            url=$(gh pr create --base main --head bot/flake-update --title "chore(flake): update inputs" --body-file "$RUNNER_TEMP/pr-body.md")
            n=$(gh pr view "$url" --json number --jq .number)
          fi
          echo "number=$n" >>"$GITHUB_OUTPUT"

      # Merge only onto the commit this run built against. "Check main" already
      # skipped a main that moved before the push; this still covers main moving
      # between the push and here, where the PR stays open and the next run
      # refreshes it. A GITHUB_TOKEN merge does not trigger check.yml, which is
      # why the attempt builds pushed to R2.
      - name: Merge
        id: merge
        if: ${{ steps.commit.outputs.committed == 'true' && steps.main.outputs.moved == 'false' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$main" == "$RUN_SHA" ]]; then
            gh pr merge "$PR" --squash --match-head-commit "$(git rev-parse HEAD)" --delete-branch \
              --subject "$(<"$RUNNER_TEMP/commit-subject.txt") (#$PR)" --body "$(<"$RUNNER_TEMP/commit-body.txt")"
            echo "merged=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::main moved since this run started; PR #$PR left open"
            echo "merged=false" >>"$GITHUB_OUTPUT"
          fi

      # Notify sends this sha; a red step here means consumers were not notified.
      - name: Landed sha
        id: landed
        if: ${{ steps.merge.outputs.merged == 'true' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          sha=""
          for _ in 1 2 3; do
            sha=$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid // empty' || true)
            [[ $sha =~ ^[0-9a-f]{40}$ ]] && break
            sleep 5
          done
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not read the squash commit of PR #$PR; consumers were not notified"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Close blocked issue
        if: ${{ steps.merge.outputs.merged == 'true' && needs.finalize.outputs.land == 'combined' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          for n in $(gh issue list --label update-blocked --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The combined update landed in #$PR."
          done

  # Main moved during the run, so land published nothing: start one fresh run,
  # carrying the validated narrow request (source/rev) when there is one.
  # A separate job keeps actions: write away from land, which runs code from the
  # freshly updated inputs (nix run .#lock-commit); the token could otherwise
  # dispatch cache-gc with deletion. This job runs nothing from the repo.
  # GITHUB_TOKEN may start workflow_dispatch runs (a documented exception to
  # "events triggered by the GITHUB_TOKEN do not create new workflow runs"); the
  # new run queues in the update concurrency group until this one ends.
  redispatch:
    needs: [prepare, land]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.land.outputs.dispatch == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start fresh run
        env:
          SOURCE: ${{ needs.prepare.outputs.source }}
          REV: ${{ needs.prepare.outputs.rev }}
        run: |
          args=(-f rerun=true)
          if [[ -n "$SOURCE" ]]; then
            args+=(-f "source=$SOURCE" -f "rev=$REV")
          fi
          gh workflow run update.yml --ref main "${args[@]}"

  # Recipients = .github/consumers.json plus the CASCADE_CONSUMERS secret
  # (recipients this public repo must not name; a secret so Actions masks it).
  # Outputs only indexes; a malformed secret fails this job.
  recipients:
    needs: [land]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.land.outputs.landed-sha != '' && vars.CASCADE_APP_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      indexes: ${{ steps.recipients.outputs.indexes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recipients
        id: recipients
        env:
          CASCADE_CONSUMERS: ${{ secrets.CASCADE_CONSUMERS }}
        run: python3 scripts/update-bot/update_bot.py recipients

  # One repository_dispatch per recipient after any run squash-merges on main.
  # It checks out this run's own github.sha and runs only update_bot.py from it
  # before the token exists, never code from the freshly updated inputs
  # (`nix run .#lock-commit` stays in land), so the App key never shares a job
  # with it.
  notify:
    needs: [land, recipients]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.land.outputs.landed-sha != '' && needs.recipients.result == 'success' && needs.recipients.outputs.indexes != '[]' && needs.recipients.outputs.indexes != '' && vars.CASCADE_APP_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.recipients.outputs.indexes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recipient
        id: recipient
        env:
          CASCADE_CONSUMERS: ${{ secrets.CASCADE_CONSUMERS }}
          INDEX: ${{ matrix.index }}
        run: python3 scripts/update-bot/update_bot.py recipient --index="$INDEX"

      - name: Token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.CASCADE_APP_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
          owner: noamsto
          repositories: ${{ steps.recipient.outputs.name }}
          permission-contents: write

      - name: Send upstream-updated
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CONSUMER: ${{ steps.recipient.outputs.repo }}
          BODY: '{"event_type":"upstream-updated","client_payload":{"source":"${{ github.repository }}","rev":"${{ needs.land.outputs.landed-sha }}"}}'
        run: |
          jq -e . <<<"$BODY" >/dev/null
          gh api --method POST "repos/$CONSUMER/dispatches" --input - <<<"$BODY"

  # One open update-blocked issue, its body replaced each run the combined tree
  # does not land (also when a half landed).
  blocked:
    needs: [finalize]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !github.event.repository.private && needs.finalize.result == 'success' && needs.finalize.outputs.blocked == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One subdirectory per report artifact; issue-body keeps each attempt's last round.
      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: false
          path: ${{ runner.temp }}/reports

      - name: Download final
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-final
          path: ${{ runner.temp }}/final

      - name: Issue body
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 scripts/update-bot/update_bot.py issue-body --final "$RUNNER_TEMP/final/final.json" \
            --reports "$RUNNER_TEMP/reports" --out "$RUNNER_TEMP/issue.md"

      - name: Open or update issue
        run: |
          gh label create update-blocked --color B60205 --description "Nightly flake update could not land" --force
          n=$(gh issue list --label update-blocked --state open --json number --jq '.[0].number // empty')
          if [[ -n "$n" ]]; then
            gh issue edit "$n" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Nightly flake update blocked" --label update-blocked --body-file "$RUNNER_TEMP/issue.md"
          fi
