name: Update attempt

# One candidate tree (flake.lock + pins.json) through the pin loop: build it,
# decide land/repin/block, and on repin build the next tree, up to 3 rounds.
# Called only by update.yml, which runs on main and never on PR code.
on:
  workflow_call:
    inputs:
      attempt:
        description: combined, nixpkgs or inputs
        type: string
        required: true
      tree-artifact:
        description: Artifact holding the round-1 flake.lock + pins.json
        type: string
        required: true
    secrets:
      NIX_CACHE_SIGNING_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
    outputs:
      result:
        description: land or block
        value: ${{ jobs.result.outputs.result }}
      tree-artifact:
        description: Artifact of the tree that built green (empty unless result is land)
        value: ${{ jobs.result.outputs.tree }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Job conditions: GitHub's implicit success() skips a job whenever any ancestor
# was skipped, so every job after build-1 starts with !cancelled() and checks the
# decide output it depends on explicitly.
jobs:
  # Every round pushes what it built, green or not: the bot's GITHUB_TOKEN merge
  # does not trigger check.yml on main, so this is the only push to R2
  # for the update, and later rounds substitute what earlier rounds built.
  build-1:
    uses: ./.github/workflows/build.yml
    with:
      push-cache: true
      tree-artifact: ${{ inputs.tree-artifact }}
      report: true
      report-name: report-${{ inputs.attempt }}-1
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  decide-1:
    needs: build-1
    # Also after a failed build job: a missing report makes decide block.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: accept-flake-config = true

      - name: Download tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tree-artifact }}
          path: ${{ runner.temp }}/tree

      # One subdirectory per report. A missing report must reach decide (which
      # blocks on it) instead of failing the job.
      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-${{ inputs.attempt }}-1-*
          merge-multiple: false
          path: ${{ runner.temp }}/reports

      - name: Decide
        id: decide
        env:
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 scripts/update-bot/update_bot.py decide --attempt "$ATTEMPT" --round 1 --max-rounds 3 \
            --reports "$RUNNER_TEMP/reports" --expected-jobs "check darwin aarch64-linux" \
            --tree "$RUNNER_TEMP/tree" --out "$RUNNER_TEMP/next"

      - name: Upload next tree
        if: ${{ steps.decide.outputs.action == 'repin' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-${{ inputs.attempt }}-1
          path: |
            ${{ runner.temp }}/next/flake.lock
            ${{ runner.temp }}/next/pins.json
          if-no-files-found: error
          retention-days: 7

  build-2:
    needs: decide-1
    if: ${{ !cancelled() && needs.decide-1.outputs.action == 'repin' }}
    uses: ./.github/workflows/build.yml
    with:
      push-cache: true
      tree-artifact: tree-${{ inputs.attempt }}-1
      report: true
      report-name: report-${{ inputs.attempt }}-2
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  decide-2:
    needs: [decide-1, build-2]
    if: ${{ !cancelled() && needs.decide-1.outputs.action == 'repin' }}
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: accept-flake-config = true

      - name: Download tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-${{ inputs.attempt }}-1
          path: ${{ runner.temp }}/tree

      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-${{ inputs.attempt }}-2-*
          merge-multiple: false
          path: ${{ runner.temp }}/reports

      - name: Decide
        id: decide
        env:
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 scripts/update-bot/update_bot.py decide --attempt "$ATTEMPT" --round 2 --max-rounds 3 \
            --reports "$RUNNER_TEMP/reports" --expected-jobs "check darwin aarch64-linux" \
            --tree "$RUNNER_TEMP/tree" --out "$RUNNER_TEMP/next"

      - name: Upload next tree
        if: ${{ steps.decide.outputs.action == 'repin' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-${{ inputs.attempt }}-2
          path: |
            ${{ runner.temp }}/next/flake.lock
            ${{ runner.temp }}/next/pins.json
          if-no-files-found: error
          retention-days: 7

  build-3:
    needs: decide-2
    if: ${{ !cancelled() && needs.decide-2.outputs.action == 'repin' }}
    uses: ./.github/workflows/build.yml
    with:
      push-cache: true
      tree-artifact: tree-${{ inputs.attempt }}-2
      report: true
      report-name: report-${{ inputs.attempt }}-3
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # Round 3 is the cap: decide never repins here, so there is no next tree.
  decide-3:
    needs: [decide-2, build-3]
    if: ${{ !cancelled() && needs.decide-2.outputs.action == 'repin' }}
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: accept-flake-config = true

      - name: Download tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-${{ inputs.attempt }}-2
          path: ${{ runner.temp }}/tree

      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-${{ inputs.attempt }}-3-*
          merge-multiple: false
          path: ${{ runner.temp }}/reports

      - name: Decide
        id: decide
        env:
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 scripts/update-bot/update_bot.py decide --attempt "$ATTEMPT" --round 3 --max-rounds 3 \
            --reports "$RUNNER_TEMP/reports" --expected-jobs "check darwin aarch64-linux" \
            --tree "$RUNNER_TEMP/tree" --out "$RUNNER_TEMP/next"

  # The last decide that ran settles the attempt. Round k builds the tree decide
  # k-1 wrote, so a round-k land names tree-<attempt>-(k-1) (round 1: the input
  # tree). A failed or missing decide, or a final repin, counts as block.
  result:
    needs: [decide-1, decide-2, decide-3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
      tree: ${{ steps.result.outputs.tree }}
    steps:
      - name: Result
        id: result
        env:
          ATTEMPT: ${{ inputs.attempt }}
          INPUT_TREE: ${{ inputs.tree-artifact }}
          ACTION_1: ${{ needs.decide-1.outputs.action }}
          ACTION_2: ${{ needs.decide-2.outputs.action }}
          ACTION_3: ${{ needs.decide-3.outputs.action }}
        run: |
          last="" round=0
          for k in 1 2 3; do
            var="ACTION_$k"
            if [[ -n "${!var}" ]]; then
              last="${!var}"
              round=$k
            fi
          done
          result=block tree=""
          if [[ "$last" == land ]]; then
            result=land
            if ((round == 1)); then
              tree="$INPUT_TREE"
            else
              tree="tree-$ATTEMPT-$((round - 1))"
            fi
          fi
          echo "attempt $ATTEMPT: last decision '${last:-none}' (round $round) -> $result $tree"
          {
            echo "result=$result"
            echo "tree=$tree"
          } >>"$GITHUB_OUTPUT"
